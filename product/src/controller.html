<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>抽奖控制器</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(to bottom, #131313, #02101c);
      color: rgba(127,255,255,0.75);
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
    }
    .container {
      padding: 16px;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
    }
    .header {
      text-align: center;
      padding: 12px 0 8px;
    }
    .header .title {
      font-size: 20px;
      color: #fff;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(127,255,255,0.5);
      margin-bottom: 16px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.connected { background: #00ff88; }
    .status-dot.disconnected { background: #ff4444; }

    .info-panel {
      background: rgba(0,127,127,0.08);
      border: 1px solid rgba(127,255,255,0.12);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 14px;
    }
    .info-row .label { color: rgba(127,255,255,0.5); }
    .info-row .value { color: #fff; font-weight: bold; }

    .prize-status {
      margin-bottom: 16px;
    }
    .prize-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      margin-bottom: 6px;
      background: rgba(0,127,127,0.06);
      border-radius: 8px;
      font-size: 13px;
    }
    .prize-item.current {
      border: 1px solid rgba(127,255,255,0.3);
      background: rgba(0,127,127,0.15);
    }
    .prize-item.done {
      opacity: 0.4;
    }
    .prize-item .prize-name { flex: 1; }
    .prize-item .prize-count { color: rgba(127,255,255,0.6); }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-row {
      display: flex;
      gap: 12px;
    }
    .btn {
      flex: 1;
      padding: 16px 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid rgba(127,255,255,0.25);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      color: rgba(127,255,255,0.85);
      background: rgba(0,127,127,0.2);
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active {
      background: rgba(0,127,127,0.5);
      transform: scale(0.97);
    }
    .btn.primary {
      background: rgba(0,160,160,0.35);
      border-color: rgba(127,255,255,0.4);
      font-size: 18px;
      padding: 18px;
    }
    .btn.warn {
      background: rgba(200,80,50,0.2);
      border-color: rgba(255,100,50,0.3);
    }
    .btn:disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .footer {
      text-align: center;
      padding: 20px 0;
      font-size: 11px;
      color: rgba(127,255,255,0.25);
    }
    .disconnected-overlay {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      color: #ff4444;
      font-size: 18px;
    }

    /* custom confirm dialog */
    .confirm-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75); z-index: 300;
      display: flex; align-items: center; justify-content: center;
      animation: ctrlConfirmFadeIn 0.15s ease;
    }
    @keyframes ctrlConfirmFadeIn { from { opacity: 0; } to { opacity: 1; } }
    .confirm-dialog {
      width: 90vw; max-width: 340px;
      background: #1a1f2e; border-radius: 14px;
      border: 1px solid rgba(127,255,255,0.2);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      overflow: hidden;
      animation: ctrlConfirmSlideIn 0.2s ease;
    }
    @keyframes ctrlConfirmSlideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .confirm-body { padding: 28px 24px 20px; text-align: center; }
    .confirm-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 48px; height: 48px; border-radius: 50%; margin-bottom: 16px;
      background: rgba(200,80,50,0.15); color: #ff9966; font-size: 24px;
      border: 2px solid rgba(200,80,50,0.25);
    }
    .confirm-message { font-size: 15px; color: rgba(255,255,255,0.85); line-height: 1.6; white-space: pre-line; }
    .confirm-footer { display: flex; border-top: 1px solid rgba(127,255,255,0.08); }
    .confirm-btn { flex: 1; padding: 14px 0; font-size: 15px; background: transparent; border: none; cursor: pointer; outline: none; transition: background 0.15s; }
    .confirm-btn-cancel { color: rgba(127,255,255,0.6); border-right: 1px solid rgba(127,255,255,0.08); }
    .confirm-btn-cancel:hover { background: rgba(127,127,127,0.1); color: rgba(255,255,255,0.85); }
    .confirm-btn-ok { color: #ff7788; font-weight: bold; }
    .confirm-btn-ok:hover { background: rgba(200,60,60,0.2); }
  </style>
</head>
<body>
  <div class="disconnected-overlay" id="disconnectedOverlay">
    <div>连接已断开，请刷新页面</div>
  </div>

  <div class="container">
    <div class="header">
      <div class="title">抽奖控制器</div>
    </div>
    <div class="status-bar">
      <span class="status-dot disconnected" id="statusDot"></span>
      <span id="statusText">连接中...</span>
    </div>

    <div class="info-panel">
      <div class="info-row">
        <span class="label">当前抽取</span>
        <span class="value" id="infoPrize">--</span>
      </div>
      <div class="info-row">
        <span class="label">奖品描述</span>
        <span class="value" id="infoTitle">--</span>
      </div>
      <div class="info-row">
        <span class="label">剩余名额</span>
        <span class="value" id="infoLeft">--</span>
      </div>
      <div class="info-row">
        <span class="label">剩余参与人数</span>
        <span class="value" id="infoLeftUsers">--</span>
      </div>
      <div class="info-row">
        <span class="label">总参与人数</span>
        <span class="value" id="infoTotalUsers">--</span>
      </div>
      <div class="info-row">
        <span class="label">状态</span>
        <span class="value" id="infoStatus">空闲</span>
      </div>
    </div>

    <div class="controls">
      <div class="btn-row">
        <button class="btn" id="btnRegToggle">开始报名</button>
        <button class="btn" id="btnQRToggle">显示二维码</button>
      </div>
      <button class="btn primary" id="btnToggle">开始抽奖</button>
      <div class="btn-row">
        <button class="btn" id="btnEnter">进入抽奖</button>
        <button class="btn" id="btnRelottery">重新抽奖</button>
      </div>
      <div class="btn-row">
        <button class="btn warn" id="btnReset">重置</button>
        <button class="btn" id="btnSaveData">保存结果</button>
        <button class="btn" id="btnExport">导出结果</button>
      </div>
      <div class="btn-row">
        <button class="btn" id="btnManageResults">管理结果</button>
      </div>
    </div>

    <div class="footer">
      控制器 v1.0
    </div>
  </div>

  <script>
    function showConfirm(message) {
      return new Promise(function(resolve) {
        var overlay = document.createElement("div");
        overlay.className = "confirm-overlay";
        overlay.innerHTML =
          '<div class="confirm-dialog">' +
          '<div class="confirm-body">' +
          '<div class="confirm-icon">!</div>' +
          '<div class="confirm-message">' + message + '</div>' +
          '</div>' +
          '<div class="confirm-footer">' +
          '<button class="confirm-btn confirm-btn-cancel">取消</button>' +
          '<button class="confirm-btn confirm-btn-ok">确认</button>' +
          '</div>' +
          '</div>';
        document.body.appendChild(overlay);
        overlay.querySelector(".confirm-btn-cancel").addEventListener("click", function() {
          overlay.remove();
          resolve(false);
        });
        overlay.querySelector(".confirm-btn-ok").addEventListener("click", function() {
          overlay.remove();
          resolve(true);
        });
        overlay.addEventListener("click", function(e) {
          if (e.target === overlay) {
            overlay.remove();
            resolve(false);
          }
        });
      });
    }

    (function() {
      var socket;
      var state = { isLotting: false, currentPrize: null, leftCount: 0, totalUsers: 0, isRegistrationOpen: false };
      var qrVisible = false;

      function connect() {
        socket = io({ query: { role: "controller" } });

        socket.on("connect", function() {
          document.getElementById("statusDot").className = "status-dot connected";
          document.getElementById("statusText").textContent = "已连接";
          document.getElementById("disconnectedOverlay").style.display = "none";
        });

        socket.on("disconnect", function() {
          document.getElementById("statusDot").className = "status-dot disconnected";
          document.getElementById("statusText").textContent = "连接断开";
          document.getElementById("disconnectedOverlay").style.display = "flex";
        });

        socket.on("ctrl:state", function(data) {
          state = data;
          updateUI(data);
        });

        socket.on("display:registration_state", function(data) {
          state.isRegistrationOpen = data && data.open;
          updateRegButton();
        });

        socket.on("ctrl:ack", function(data) {
          // Brief confirmation, no visible feedback needed
        });

        socket.on("display:participant_joined", function(data) {
          if (data && data.totalUsers != null) {
            document.getElementById("infoTotalUsers").textContent = data.totalUsers;
          }
        });

        socket.on("display:lottery_started", function(data) {
          if (data && data.started) {
            document.getElementById("infoStatus").textContent = "已进入抽奖";
          } else {
            document.getElementById("infoStatus").textContent = "空闲";
          }
        });
      }

      function updateUI(data) {
        if (data.currentPrize) {
          document.getElementById("infoPrize").textContent = data.currentPrize.text || "--";
          document.getElementById("infoTitle").textContent = data.currentPrize.title || "--";
        } else {
          document.getElementById("infoPrize").textContent = "--";
          document.getElementById("infoTitle").textContent = "--";
        }
        document.getElementById("infoLeft").textContent = data.leftCount != null ? data.leftCount : "--";
        document.getElementById("infoLeftUsers").textContent = data.leftCount != null ? data.leftCount : "--";
        document.getElementById("infoTotalUsers").textContent = data.totalUsers || 0;

        if (data.isLotting) {
          document.getElementById("infoStatus").textContent = "抽奖中...";
          document.getElementById("btnToggle").textContent = "结束抽奖";
          document.getElementById("btnToggle").classList.add("warn");
          document.getElementById("btnEnter").disabled = true;
          document.getElementById("btnRelottery").disabled = true;
        } else {
          document.getElementById("infoStatus").textContent = "空闲";
          document.getElementById("btnToggle").textContent = "开始抽奖";
          document.getElementById("btnToggle").classList.remove("warn");
          document.getElementById("btnEnter").disabled = false;
          document.getElementById("btnRelottery").disabled = false;
        }
      }

      function sendAction(action) {
        if (socket && socket.connected) {
          socket.emit("ctrl:command", { action: action });
        }
      }

      document.getElementById("btnToggle").addEventListener("click", function() {
        if (state.isLotting) {
          sendAction("stop");
        } else {
          sendAction("start");
        }
      });

      document.getElementById("btnEnter").addEventListener("click", function() {
        sendAction("enter");
      });

      document.getElementById("btnRelottery").addEventListener("click", function() {
        sendAction("relottery");
      });

      document.getElementById("btnReset").addEventListener("click", function() {
        showConfirm("确认重置所有抽奖数据？\n此操作不可撤销！").then(function(ok) {
          if (ok) sendAction("reset");
        });
      });

      document.getElementById("btnSaveData").addEventListener("click", function() {
        sendAction("saveData");
      });

      document.getElementById("btnManageResults").addEventListener("click", function() {
        sendAction("manageResults");
      });

      document.getElementById("btnExport").addEventListener("click", function() {
        sendAction("export");
      });

      document.getElementById("btnRegToggle").addEventListener("click", function() {
        if (state.isRegistrationOpen) {
          sendAction("registrationEnd");
        } else {
          sendAction("registrationStart");
        }
      });

      document.getElementById("btnQRToggle").addEventListener("click", function() {
        sendAction("toggleQR");
      });

      function updateRegButton() {
        var btn = document.getElementById("btnRegToggle");
        if (state.isRegistrationOpen) {
          btn.textContent = "结束报名";
          btn.classList.add("warn");
        } else {
          btn.textContent = "开始报名";
          btn.classList.remove("warn");
        }
      }

      function updateUI(data) {
        if (data.currentPrize) {
          document.getElementById("infoPrize").textContent = data.currentPrize.text || "--";
          document.getElementById("infoTitle").textContent = data.currentPrize.title || "--";
        } else {
          document.getElementById("infoPrize").textContent = "--";
          document.getElementById("infoTitle").textContent = "--";
        }
        document.getElementById("infoLeft").textContent = data.leftCount != null ? data.leftCount : "--";
        document.getElementById("infoLeftUsers").textContent = data.leftCount != null ? data.leftCount : "--";
        document.getElementById("infoTotalUsers").textContent = data.totalUsers || 0;

        if (data.isLotting) {
          document.getElementById("infoStatus").textContent = "抽奖中...";
          document.getElementById("btnToggle").textContent = "结束抽奖";
          document.getElementById("btnToggle").classList.add("warn");
          document.getElementById("btnEnter").disabled = true;
          document.getElementById("btnRelottery").disabled = true;
        } else {
          document.getElementById("infoStatus").textContent = "空闲";
          document.getElementById("btnToggle").textContent = "开始抽奖";
          document.getElementById("btnToggle").classList.remove("warn");
          document.getElementById("btnEnter").disabled = false;
          document.getElementById("btnRelottery").disabled = false;
        }

        if (data.isRegistrationOpen != null) {
          state.isRegistrationOpen = data.isRegistrationOpen;
        }
        updateRegButton();
      }

      connect();
    })();
  </script>
</body>
</html>
