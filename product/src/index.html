<!DOCTYPE html>
<html>
  <head>
    <title>年会抽奖</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <!-- <link rel="stylesheet" href="./index.css"> -->
  </head>

  <body>
    <script src="./lib/three.min.js"></script>
    <script src="./lib/tween.min.js"></script>
    <script src="./lib/TrackballControls.js"></script>
    <script src="./lib/CSS3DRenderer.js"></script>
    <script src="./lib/ajax.js"></script>

    <div class="canvas-box">
      <canvas id="canvas">你的浏览器不支持canvas</canvas>
    </div>

    <div class="music">
      <audio id="music" src="./data/music.mp3" class="music-item" loop></audio>
      <div id="musicBox" class="music-box" title="播放/暂停背景音乐">Music</div>
    </div>

    <div id="prizeBar"></div>

    <div id="container"></div>

    <div id="menu">
      <button id="enter">进入抽奖</button>
      <div id="lotteryBar" class="none">
        <button id="lottery">开始抽奖</button>
        <button id="reLottery">重新抽奖</button>
        <button id="saveData">保存结果</button>
        <button id="manageResults">管理结果</button>
        <div class="fixed-bar">
          <button id="save" class="fixed-btn">导出抽奖结果</button>
          <button id="reset" class="fixed-btn">重置</button>
        </div>
      </div>
      <div id="topBar" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:8px;">
        <button id="qrCode" style="padding:8px 20px;font-size:14px;background:rgba(0,127,127,0.3);color:rgba(127,255,255,0.8);border:1px solid rgba(127,255,255,0.3);border-radius:6px;cursor:pointer;">显示二维码</button>
        <button id="config" style="padding:8px 20px;font-size:14px;background:rgba(0,127,127,0.3);color:rgba(127,255,255,0.8);border:1px solid rgba(127,255,255,0.3);border-radius:6px;cursor:pointer;">配置</button>
        <button id="importUsers" style="padding:8px 20px;font-size:14px;background:rgba(0,127,127,0.3);color:rgba(127,255,255,0.8);border:1px solid rgba(127,255,255,0.3);border-radius:6px;cursor:pointer;">导入用户</button>
      </div>
      <input type="file" id="usersFileInput" accept=".xlsx,.xls" style="display:none;">
    </div>

    <div class="qipao-container"></div>
  </body>
</html>
